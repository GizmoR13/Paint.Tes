[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paint-tes"
version = "0.2.0"
description = "Local Ubuntu image editor for NVIDIA Volta workstations"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-or-later"

[project.scripts]
paint-tes = "paint_tes.__main__:main"

[tool.setuptools.packages.find]
include = ["paint_tes*"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
